<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Auction Game</title>

<style>
body{
  margin:0;
  background:#050d14;
  color:white;
  font-family:sans-serif;
}

/* CENTER */
.screen{
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  height:100vh;
}

/* BUTTON */
.btn{
  padding:15px;
  margin:10px;
  border:none;
  border-radius:10px;
  background:#00ff88;
  cursor:pointer;
}

/* ROOM */
#room{
  padding:20px;
}

.pool{
  background:#0c1a24;
  padding:15px;
  border-radius:10px;
}

/* PLAYERS BAR */
.players{
  position:fixed;
  bottom:0;
  width:100%;
  display:flex;
  overflow-x:auto;
  background:#0c1a24;
}

.player{
  margin:10px;
  padding:10px;
  background:#132b3a;
  border-radius:10px;
}

/* AUCTION */
#auction{
  text-align:center;
  padding:20px;
}

.big{
  font-size:40px;
}

.timer{
  font-size:30px;
  color:#00ff88;
}

.bid{
  background:red;
  padding:20px;
  border:none;
  border-radius:10px;
  color:white;
  font-size:20px;
}
</style>
</head>

<body>

<!-- HOME -->
<div class="screen" id="home">
  <h1>Auction Room</h1>
  <button class="btn" onclick="showHost()">Host</button>
  <button class="btn" onclick="showJoin()">Join</button>
</div>

<!-- HOST -->
<div class="screen" id="host" style="display:none;">
  <input id="name" placeholder="Name">
  <button class="btn" onclick="create()">Create</button>
</div>

<!-- JOIN -->
<div class="screen" id="join" style="display:none;">
  <input id="code" placeholder="Code">
  <input id="name2" placeholder="Name">
  <button class="btn" onclick="joinRoom()">Join</button>
</div>

<!-- ROOM -->
<div id="room" style="display:none;">
  <h2>Room: <span id="roomCode"></span></h2>

  <div class="pool">
    <input id="playerInput">
    <button onclick="addPlayer()">Add</button>
    <ul id="pool"></ul>
  </div>

  <button onclick="start()">Start Auction</button>
</div>

<!-- AUCTION -->
<div id="auction" style="display:none;">
  <div class="big" id="currentPlayer"></div>
  <div class="timer" id="timer">10</div>
  <div>Bid: <span id="bid">0</span></div>
  <div>Leader: <span id="leader"></span></div>
  <button class="bid" onclick="bid()">BID</button>
</div>

<div class="players" id="players"></div>

<script>
let socket = new WebSocket("wss://football-auction-pm2k.onrender.com");

function showHost(){
  home.style.display="none";
  host.style.display="flex";
}

function showJoin(){
  home.style.display="none";
  join.style.display="flex";
}

function create(){
  socket.send(JSON.stringify({type:"create",name:name.value}));
}

function joinRoom(){
  socket.send(JSON.stringify({type:"join",code:code.value,name:name2.value}));
}

function addPlayer(){
  socket.send(JSON.stringify({type:"addPlayer",name:playerInput.value}));
}

function start(){
  socket.send(JSON.stringify({type:"start"}));
}

function bid(){
  socket.send(JSON.stringify({type:"bid"}));
}

socket.onmessage = (msg)=>{
  let data = JSON.parse(msg.data);

  if(data.type==="room"){
    host.style.display="none";
    room.style.display="block";
    roomCode.innerText=data.code;
  }

  if(data.type==="update"){
    players.innerHTML="";
    data.players.forEach(p=>{
      players.innerHTML+=`<div class="player">${p}</div>`;
    });

    pool.innerHTML="";
    data.pool.forEach(p=>{
      pool.innerHTML+=`<li>${p}</li>`;
    });

    bid.innerText=data.bid || 0;
    leader.innerText=data.bidder || "-";
  }

  if(data.type==="auction"){
    room.style.display="none";
    auction.style.display="block";
    currentPlayer.innerText=data.player;
  }

  if(data.type==="timer"){
    timer.innerText=data.time;
  }
}
</script>

</body>
</html>
